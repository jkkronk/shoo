# XcodeGen project spec — source of truth for Shoo.xcodeproj.
# Regenerate with: xcodegen generate   (or: bash scripts/bootstrap.sh)
name: Shoo

options:
  bundleIdPrefix: io.github.jkkronk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Team ID (Individual enrollment). Not a secret: it is embedded in
    # every signed build. Change it only if the app moves to another developer account.
    DEVELOPMENT_TEAM: 8HW5ABG4L2
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Shoo uses only OS-provided crypto → exempt from export compliance. Set here (and
    # mirrored in Info.plist) so uploads don't re-prompt for export compliance each time.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  Shoo:
    type: application
    platform: macOS
    sources:
      - path: Shoo
    settings:
      base:
        # Permanent once the first build is uploaded to App Store Connect. Never change it.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jkkronk.shoo
        PRODUCT_NAME: Shoo
        INFOPLIST_FILE: Shoo/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shoo/Shoo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES

  ShooTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShooTests
    dependencies:
      - target: Shoo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jkkronk.shoo.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Shoo:
    build:
      targets:
        Shoo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShooTests
